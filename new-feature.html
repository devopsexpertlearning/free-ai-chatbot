<!DOCTYPE html>                               <html lang="en">
<head>
<meta charset="UTF-8">
<title>AI Image Analysis</title>
<style>
body {
    font-family: Arial, sans-serif;
    margin: 30px;
    background-color: #f5f5f5;
}
input, button {
    padding: 8px;
    margin: 5px 0;
}
#analysis img {                                   max-width: 150px;
    max-height: 150px;                            margin: 10px 0;
    border-radius: 8px;
    object-fit: cover;
}
#error {
    color: red;
    margin-top: 10px;
}
#loading {
    color: blue;
    font-weight: bold;
    margin-top: 10px;
}
#chat {
    margin-top: 20px;
    max-width: 600px;
    border-radius: 10px;
    overflow-y: auto;
    padding: 10px;
    background: #fff;
    box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    height: 500px;
}
.chat-message {
    display: flex;
    margin-bottom: 12px;
}
.chat-message.ai {
    justify-content: flex-start;
}
.bubble {
    padding: 10px 15px;
    max-width: 80%;
    word-wrap: break-word;
    white-space: pre-wrap;
    background: #e1ffc7;
    border-radius: 15px 15px 15px 0;
}
</style>
</head>
<body>
<h1>AI Image Analysis</h1>

<input type="file" id="imageFile" accept="image/*" multiple>
<br>
<button onclick="analyzeImages()">Analyze Images</button>

<div id="error"></div>
<div id="analysis"></div>
<div id="loading"></div>
<div id="chat"></div>

<script src="https://js.puter.com/v2/"></script>
<script>
// Function to resize image to max width/height
function resizeImage(file, maxWidth = 1024, maxHeight = 1024, quality = 0.8) {
    return new Promise((resolve, reject) => {
        const img = new Image();
        const reader = new FileReader();

        reader.onload = e => { img.src = e.target.result; };
        reader.onerror = e => reject(e);

        img.onload = () => {
            let { width, height } = img;
            if (width > maxWidth || height > maxHeight) {
                const ratio = Math.min(maxWidth / width, maxHeight / height);
                width = width * ratio;
                height = height * ratio;
            }

            const canvas = document.createElement('canvas');
            canvas.width = width;
            canvas.height = height;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, width, height);
            const resizedDataUrl = canvas.toDataURL('image/jpeg', quality);
            resolve(resizedDataUrl);
        };

        reader.readAsDataURL(file);
    });
}

// Analyze multiple images
async function analyzeImages() {
    const fileInput = document.getElementById('imageFile');
    const errorDiv = document.getElementById('error');
    const analysisDiv = document.getElementById('analysis');
    const loadingDiv = document.getElementById('loading');
    const chatDiv = document.getElementById('chat');

    errorDiv.innerHTML = '';
    analysisDiv.innerHTML = '';
    loadingDiv.innerHTML = '';

    const files = fileInput.files;
    if (!files.length) {
        errorDiv.innerHTML = '⚠ Please select at least one image.';
        return;
    }

    for (const file of files) {
        if (!file.type.startsWith('image/')) {
            errorDiv.innerHTML = `⚠ File "${file.name}" is not an image. Skipping.`;
            continue;
        }

        loadingDiv.innerHTML = `Processing "${file.name}"...`;

        try {
            const resizedDataUrl = await resizeImage(file, 1024, 1024, 0.8);

            // Show thumbnail
            const imgWrapper = document.createElement('div');
            imgWrapper.innerHTML = `<img src="${resizedDataUrl}"><br>`;
            analysisDiv.appendChild(imgWrapper);

            // Create chat bubble for AI response
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('chat-message', 'ai');
            const bubbleDiv = document.createElement('div');
            bubbleDiv.classList.add('bubble');
            messageDiv.appendChild(bubbleDiv);
            chatDiv.appendChild(messageDiv);
            chatDiv.scrollTop = chatDiv.scrollHeight;

            // Call Puter AI chat with streaming
            const responseStream = await puter.ai.chat(
                "Describe this image in detail. What objects, people, or scenes do you see?",
                resizedDataUrl,
                { stream: true }
            );

            for await (const chunk of responseStream) {
                if (chunk?.text) {
                    bubbleDiv.innerHTML += chunk.text.replaceAll('\n', '<br>');
                    chatDiv.scrollTop = chatDiv.scrollHeight;
                }
            }

        } catch (err) {
            console.error(err);
            errorDiv.innerHTML += `<br>❌ Error processing "${file.name}".`;
        }
    }

    loadingDiv.innerHTML = '';
}
</script>
</body>
